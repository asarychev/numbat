[package]
name = "numbat-jupyter"
version = "0.1.0"
edition = "2024"

[dependencies]
juker = { path = "../../juker" }
tracing-udp = { path = "../../juker/tracing-udp" }
anyhow = { version = "1.0.102", features = ["backtrace"] }
numbat = { version = "1.23.0", path = "../numbat" }
clap = "4.6.1"
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tokio-macros = "2.7.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
